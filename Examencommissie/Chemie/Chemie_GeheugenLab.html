/* Beeldatlas en afbeeldingen laboratoriummateriaal, digitaal én offline herkenbaar */
.lab-picture{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio: 300/232;width:min(100%,310px);max-height:250px;margin:auto;overflow:hidden;background:radial-gradient(circle at 50% 24%,#fff,#eaf5f2 82%);border-radius:14px}
.lab-picture .lab-vector{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.lab-picture .lab-vector svg{max-width:96%;height:94%;width:auto;filter:drop-shadow(0 8px 7px #0c454317)}
.lab-picture img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f9fdfc;padding:2px;opacity:0;transition:opacity .16s ease}
.lab-picture img.ready{opacity:1}
.src-info{display:block;font-size:10px;color:#497b78;text-align:center;margin:2px 0 4px;line-height:1.3}
.atlas-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:16px}
.atlas-item{background:white;border:1px solid #cde4df;border-radius:18px;overflow:hidden;box-shadow:0 9px 23px #0f47400b}
.atlas-item .lab-picture{max-width:none;border-radius:0;aspect-ratio:4/3}
.atlas-copy{padding:12px 15px 17px}.atlas-copy h3{margin:0 0 6px;font-size:17px;color:#12635e}.atlas-copy p{margin:0 0 9px;font-size:13px;line-height:1.5}.atlas-copy small{color:#627a7a;font-size:11px}
.study-card.study-material{min-height:278px;text-align:center;align-items:center;gap:3px}.study-material-art{width:100%;display:block}.study-material-art .lab-picture{max-height:178px}.study-card.study-material b{font-size:15px;line-height:1.4;max-width:95%;color:#12635e}
.figure .lab-picture{width:320px;max-width:100%;height:240px}.figure:has(.lab-picture){background:linear-gradient(140deg,#f1fbf9,#eaf5f3)}
@media(max-width:620px){.atlas-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.atlas-copy{padding:10px}.atlas-copy h3{font-size:13px}.atlas-copy p{font-size:11px}.atlas-copy small{font-size:9px}.study-material-art .lab-picture{max-height:148px}.study-card.study-material{min-height:240px}}

/* Foto-editie: echte foto's verschijnen prominent; schetsen zijn een offline-reserve. */
.lab-picture{background:#ffffff;border-bottom:1px solid #e3eeea}
.lab-picture img{padding:8px 12px;object-fit:contain;background:white;filter:none;}
.lab-picture img.ready{opacity:1}
.atlas-item .src-info{padding:3px 7px 5px}
.appendix-reference{margin-top:26px}.appendix-reference details{padding:12px 18px!important}
.appendix-reference summary{cursor:pointer;color:#12635e;font-weight:700}
.appendix-img{display:block;width:min(100%,900px);height:auto;margin:15px auto;border:1px solid #dce9e5;border-radius:12px}
@media(max-width:650px){.atlas-item .lab-picture{aspect-ratio:4/3}.lab-picture img{padding:3px 6px}.appendix-reference details{padding:12px!important}}

function init(){try{const old=JSON.parse(safeLocal.get(keyFor())||'null');if(old?.stats)state={...initial(),...old}}catch(e){};showLogin=!isAuthenticated()&&!safeSession.get('astremlab_geheugen_demo');render();if(isAuthenticated())activateOnline();}
function isAuthenticated(){return /^[A-Za-z0-9-]{1,40}$/.test(safeSession.get(SESSION_ID))&&/^[a-f0-9]{64}$/i.test(safeSession.get(SESSION_TOKEN))}
function headers(){return {'X-Leerling-ID':safeSession.get(SESSION_ID),'X-Leerling-Token':safeSession.get(SESSION_TOKEN)}}
function toast(s){let e=$('toast');if(!e)return;e.textContent=s;e.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.style.display='none',3400)}
function status(s){lastCloud=s;let e=$('cloudStatus');if(e)e.textContent=s}
function save(){state.updatedAt=new Date().toISOString();safeLocal.set(keyFor(),JSON.stringify(state));rev++;if(isAuthenticated()){safeLocal.set(keyFor()+'_pending','1');if(onlineReady){clearTimeout(saveTimer);saveTimer=setTimeout(()=>sync(),1200)}}}
function report(){const attempted=Object.values(state.stats).filter(s=>s.tries>0).length;const success=Object.values(state.stats).filter(s=>s.correct>0).length;const totals=Object.fromEntries(CATEGORIES.map(c=>[c.id,QUESTIONS.filter(q=>q.cat===c.id).length]));return {app:'ASTREM Lab · Chemie GeheugenLab',code:LEERPAD,datum:new Date().toISOString(),account:isAuthenticated()?safeSession.get(SESSION_ID):'voorbeeldmodus',bron:'Vakfiche chemie 2 DO natuurwetenschappen (2026)',vragen:{totaal:QUESTIONS.length,beantwoord:attempted,opgelost:success},perModule:CATEGORIES.map(c=>({code:c.id,titel:c.title,totaal:totals[c.id],beantwoord:QUESTIONS.filter(q=>q.cat===c.id&&state.stats[q.id]?.tries>0).length,opgelost:QUESTIONS.filter(q=>q.cat===c.id&&state.stats[q.id]?.correct>0).length,moeilijk:QUESTIONS.filter(q=>q.cat===c.id&&state.stats[q.id]?.wrong>0).map(q=>({id:q.id,vraag:q.prompt.replace(/<[^>]*>/g,''),laatsteAntwoord:state.stats[q.id].lastAnswer,fouten:state.stats[q.id].wrong,volgendeHerhaling:state.stats[q.id].dueAt}))})),antwoorden:QUESTIONS.filter(q=>state.stats[q.id]?.tries>0).map(q=>({id:q.id,onderdeel:q.cat,onderwerp:q.sub,vraag:q.prompt.replace(/<[^>]*>/g,''),antwoord:state.stats[q.id].lastAnswer,laatsteJuist:state.stats[q.id].lastCorrect,correctAntwoord:q.answer,pogingen:state.stats[q.id].tries,fouten:state.stats[q.id].wrong,streak:state.stats[q.id].streak,volgendeHerhaling:state.stats[q.id].dueAt})),recentePogingen:state.history.slice(-250),updatedAt:state.updatedAt,voortgang:state};}
async function activateOnline(){if(!isAuthenticated())return;status('Verbinden met Cloudflare…');try{let r=await fetch(API+'/rapport?leerpad='+encodeURIComponent(LEERPAD),{headers:headers()});let d=await r.json();if(!r.ok||!d.ok)throw Error(d.fout||'Verbinding geweigerd');onlineReady=true;const remote=d.rapport?.voortgang;if(remote?.stats&&!safeLocal.get(keyFor()+'_pending')&&(!state.updatedAt||Date.parse(remote.updatedAt||0)>Date.parse(state.updatedAt||0))){state={...initial(),...remote};safeLocal.set(keyFor(),JSON.stringify(state));render()}status('Online opvolging actief ✓');if(safeLocal.get(keyFor()+'_pending'))await sync(true)}catch(err){onlineReady=false;status('Alleen lokaal · '+err.message)}}
async function sync(force=false){if(!isAuthenticated()){toast('In voorbeeldmodus blijft je voortgang lokaal');return}if(!onlineReady){await activateOnline();return}if(busy||(!force&&!safeLocal.get(keyFor()+'_pending')))return;busy=true;let revision=rev;status('Online rapport opslaan…');try{let r=await fetch(API+'/rapport',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({leerpad:LEERPAD,rapport:report()})});let d=await r.json();if(!r.ok||!d.ok)throw Error(d.fout||'Verbinding mislukt');if(revision===rev){safeLocal.del(keyFor()+'_pending');status('Online gesynchroniseerd ✓')}else status('Nog wijzigingen te synchroniseren')}catch(e){status('Lokaal bewaard · online fout: '+e.message)}finally{busy=false}}
async function login(){let id=$('authId').value.trim(),token=$('authToken').value.trim().toLowerCase();if(!/^[A-Za-z0-9-]{1,40}$/.test(id)||!/^[a-f0-9]{64}$/.test(token)){toast('Voer je leerling-ID en persoonlijke 64-tekenscode in');return}try{$('loginBtn').disabled=true;let r=await fetch(API+'/rapport?leerpad='+encodeURIComponent('chemie-tweedegraad-olivia'),{headers:{'X-Leerling-ID':id,'X-Leerling-Token':token}});let d=await r.json();if(!r.ok||!d.ok)throw Error(d.fout||'Ongeldige gegevens');safeSession.set(SESSION_ID,id);safeSession.set(SESSION_TOKEN,token);safeSession.del('astremlab_geheugen_demo');showLogin=false;state=initial();init();toast('Aangemeld bij ASTREM Lab')}catch(e){toast('Aanmelden mislukt: '+e.message)}finally{let b=$('loginBtn');if(b)b.disabled=false}}
function demo(){safeSession.set('astremlab_geheugen_demo','1');showLogin=false;init();toast('Voorbeeldmodus – antwoorden blijven op dit toestel')}
function logout(){safeSession.del(SESSION_ID);safeSession.del(SESSION_TOKEN);safeSession.del('astremlab_geheugen_demo');state=initial();showLogin=true;activeRound=null;render()}
function dload(data,name,type){const blob=new Blob([data],{type:type+';charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportJSON(){dload(JSON.stringify(report(),null,2),'ASTREM_Chemie_GeheugenLab_rapport.json','application/json')}
function exportCSV(){const rows=[['Leerling','Categorie','Oefening','Vraag','Laatste antwoord','Correct antwoord','Laatste juist','Pogingen','Fouten','Volgende herhaling']];for(const qq of QUESTIONS){let s=state.stats[qq.id];if(s?.tries)rows.push([safeSession.get(SESSION_ID)||'gast',qq.cat,qq.id,qq.prompt.replace(/<[^>]*>/g,''),s.lastAnswer,qq.answer,s.lastCorrect,s.tries,s.wrong,s.dueAt||''])}const esc=s=>'"'+String(s??'').replaceAll('"','""')+'"';dload('\ufeff'+rows.map(r=>r.map(esc).join(';')).join('\n'),'ASTREM_Chemie_GeheugenLab_rapport.csv','text/csv')}
function dateFmt(s){try{return new Date(s).toLocaleDateString('nl-BE')}catch(e){return '—'}}
function due(q){let s=state.stats[q.id];return !!s&&s.tries>0&&(!s.dueAt||new Date(s.dueAt)<=new Date())}
function unseen(q){return !state.stats[q.id]?.tries}
function score(cat='all'){let qs=cat==='all'?QUESTIONS:QUESTIONS.filter(q=>q.cat===cat);return {total:qs.length,tried:qs.filter(q=>state.stats[q.id]?.tries>0).length,passed:qs.filter(q=>state.stats[q.id]?.correct>0).length,due:qs.filter(due).length,wrong:qs.filter(q=>state.stats[q.id]?.wrong>0).length}}
function saveResult(q,answer,correct){let s=state.stats[q.id]||{tries:0,correct:0,wrong:0,streak:0};s.tries++;s.lastAnswer=answer;s.lastCorrect=!!correct;s.lastAt=new Date().toISOString();if(correct){s.correct++;s.streak++;const intervals=[0,1,3,7,14,30];const days=intervals[Math.min(s.streak,5)];s.dueAt=new Date(Date.now()+days*86400000).toISOString()}else{s.wrong++;s.streak=0;s.dueAt=new Date().toISOString()};state.stats[q.id]=s;state.history.push({id:q.id,cat:q.cat,correct,answer,at:s.lastAt});if(state.history.length>800)state.history=state.history.slice(-800);save()}
const subs={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁺':'+','⁻':'-'};
function normalize(s){let n=String(s||'').trim().toLowerCase();n=[...n].map(c=>subs[c]||c).join('');n=n.replace(/[‐‑–—−]/g,'-').replace(/\^/g,'').replace(/\((\d+[+-])\)$/,'$1').replace(/\s+/g,'').replace(/\./g,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');return n}
function equals(q,val){let n=normalize(val);return [q.answer,...(q.aliases||[])].some(a=>normalize(a)===n)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffled(a){let b=a.slice();for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[j],b[i]]=[b[i],b[j]]}return b}
function opts(q){if(!q.options)return [];let a=shuffled(q.options.filter(x=>normalize(x)!==normalize(q.answer))).slice(0,3);return shuffled([q.answer,...a])}
function navTo(x){view=x;activeRound=null;render();scrollTo({top:0,behavior:'smooth'})}
function startRound(cat='all',qty=20,kind='practice',selection='mix'){let qs=(cat==='all'?QUESTIONS:QUESTIONS.filter(q=>q.cat===cat));if(selection==='unseen')qs=qs.filter(unseen);if(selection==='mistakes')qs=qs.filter(q=>state.stats[q.id]?.wrong>0);if(selection==='image')qs=qs.filter(q=>!!q.visual);if(selection==='due')qs=qs.filter(due);if(!qs.length){toast('Geen vragen voor deze selectie. Kies een andere oefenmodus.');return}if(selection==='mix'){qs=shuffled(qs).sort((a,b)=>((unseen(b)?1:due(b)?0.8:0)-(unseen(a)?1:due(a)?0.8:0)))}else qs=shuffled(qs);let chosen=qs.slice(0,qty);activeRound={id:'r'+Date.now(),cat,questions:chosen.map(q=>q.id),index:0,right:0,wrong:0,kind,startedAt:Date.now(),attempts:[],finished:false};selected='';currentAnswer='';revealed=false;view='round';render();scrollTo({top:0,behavior:'smooth'})}
function checkAnswer(){if(!activeRound||revealed)return;const qq=byID[activeRound.questions[activeRound.index]],value=qq.mode==='mc'?selected:($('answerInput')?.value||'').trim();if(!value){toast('Vul eerst een antwoord in.');return}let yes=equals(qq,value);saveResult(qq,value,yes);activeRound.right+=yes?1:0;activeRound.wrong+=yes?0:1;activeRound.attempts.push({id:qq.id,answer:value,yes});currentAnswer=value;if(activeRound.kind==='test'){next();return}revealed=true;render();setTimeout(()=>$('nextBtn')?.focus(),0)}
function next(){if(!activeRound)return;if(activeRound.index>=activeRound.questions.length-1){activeRound.finished=true;view='finished';render();return}activeRound.index++;selected='';currentAnswer='';revealed=false;render();setTimeout(()=>$('answerInput')?.focus(),80)}
function showSolution(){if(!activeRound||revealed)return;let qq=byID[activeRound.questions[activeRound.index]];saveResult(qq,'[antwoord getoond]',false);activeRound.wrong++;activeRound.attempts.push({id:qq.id,answer:'[antwoord getoond]',yes:false});currentAnswer='[antwoord getoond]';revealed=true;render()}
function choose(value){selected=value;const q=activeRound&&byID[activeRound.questions[activeRound.index]];if(q&&q.mode==='mc')render()}
function htmlicon(){return '<span aria-hidden="true" style="display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:#ffb703;color:#0e3f43;font-weight:900">A</span>'}
function render(){const app=$('app');let n='<div class="shell"><aside class="sidebar"><div class="brand">'+htmlicon()+' <strong>ASTREM LAB</strong><small>CHEMIE · GEHEUGENLAB · 2026</small></div><nav>';

if(view==='home')n+=home();else if(view==='atlas')n+=materialAtlas();else if(view==='study')n+=study();else if(view==='practice')n+=practice();else if(view==='review')n+=review();else if(view==='progress')n+=progressView();else if(view.startsWith('cat:'))n+=categoryView(view.split(':')[1]);else if(view==='round')n+=roundView();else if(view==='finished')n+=finishedView();else n+=home();n+='</main></div>';
if(showLogin)n+=loginView();app.innerHTML=n;attach();}
function moduleCard(c){let s=score(c.id),pct=Math.round(s.tried/s.total*100);return `<article class="module"><div class="head"><span class="ico">${c.icon}</span><span class="tag">${s.total} vragen</span></div><h3>${ESC(c.title)}</h3><p>${ESC(c.desc)}</p><div class="progress"><i style="width:${pct}%"></i></div><div class="tiny">${s.tried}/${s.total} geprobeerd · ${s.due} herhalingen</div><div class="bottom"><span class="tiny">Vakfiche p. ${ESC(c.page)}</span><button class="btn sm pale" data-nav="cat:${c.id}">Open →</button></div></article>`}
function home(){let s=score();return `<section class="hero"><div class="eyebrow">⚗️ ASTREM LAB / OLIVIA / GEHEUGENTRAINING</div><h1>Onthoud chemie.<br>Begrijp wat je schrijft.</h1><p>Oefen elementsymbolen, de tien n-alkanen, alkenen en alkynen, zuurresten zoals SO₄²⁻, stofklassen, zoutformules en labomateriaal. Korte rondes, gerichte herhaling en onmiddellijke feedback.</p><div class="hero-actions"><button class="btn primary" data-start="all|20|practice|mix">▶ Start 20 gemengde vragen</button><button class="btn ghost" data-nav="study">📘 Eerst studeren</button><button class="btn ghost" data-nav="review">🔁 Herhaal mijn fouten</button><button class="btn ghost" data-nav="atlas">🔬 33 materialen met afbeeldingen</button></div></section><section class="grid"><div class="kpi"><div class="value">${QUESTIONS.length}</div><div class="lbl">Oefenopdrachten</div></div><div class="kpi"><div class="value">${s.tried}</div><div class="lbl">Unieke vragen geprobeerd</div></div><div class="kpi"><div class="value">${s.passed}</div><div class="lbl">Minstens eenmaal juist</div></div><div class="kpi"><div class="value">${s.due}</div><div class="lbl">Toe aan herhaling</div></div></section><section class="section"><div class="section-head"><h2>Kies een onderwerp</h2><span class="tiny">8 modules · afgestemd op vakfiche 2026</span></div><div class="module-grid">${CATEGORIES.map(moduleCard).join('')}</div></section><section class="duo"><div class="panel"><h3>🎯 Wat moet je zeker kennen?</h3><p><b>Uit het hoofd:</b> 45 elementsymbolen uit de vakfiche, de namen en formules van de tien n-alkanen, de genoemde ionen en belangrijke stofnamen. <b>Herkennen/toepassen:</b> C=C en C≡C, stofklassen, zoutformules, labomateriaal en veiligheidsinformatie.</p><div class="note"><b>Belangrijk onderscheid:</b> de vakfiche vraagt expliciet naam ↔ formule van de laagste tien <b>n-alkanen</b>. Alkenen en alkynen moet je zeker kunnen herkennen aan de structuur. Extra formulevragen over deze reeksen staan als oefening, function categoryView(id){let c=CATEGORIES.find(x=>x.id===id)||CATEGORIES[0],s=score(c.id);return `<section class="hero"><div class="eyebrow">MODULE · VAKFICHE P. ${ESC(c.page)}</div><h1>${c.icon} ${ESC(c.title)}</h1><p>${ESC(c.desc)}. Train de kennis die je nodig hebt voor moeilijkere toepassingen in ChemieLab en de examenbundels.</p></section><section class="grid"><div class="kpi"><div class="value">${s.total}</div><div class="lbl">Vragen</div></div><div class="kpi"><div class="value">${s.tried}</div><div class="lbl">Geprobeerd</div></div><div class="kpi"><div class="value">${s.passed}</div><div class="lbl">Al correct</div></div><div class="kpi"><div class="value">${s.due}</div><div class="lbl">Te herhalen</div></div></section><div class="panel"><h2>Oefen dit onderdeel</h2><div class="controls"><button class="btn primary" data-start="${id}|10|practice|mix">10 vragen</button><button class="btn dark" data-start="${id}|20|practice|mix">20 vragen</button><button class="btn ghost" data-start="${id}|40|test|mix">Toets (40 vragen)</button><button class="btn pale" data-start="${id}|20|practice|mistakes">Fouten herhalen</button><button class="btn ghost" data-nav="study">Leerkaarten bekijken</button>${id==='materiaal'?'<button class="btn pale" data-nav="atlas">🔬 Beeldatlas</button><button class="btn dark" data-start="materiaal|20|practice|image">20 beeldvragen</button>':''}</div><p>Bij het oefenen krijg je na iedere vraag uitleg. In de toetsmodus krijg je geen hints of oplossingen tussen de vragen; je bekijkt je resultaten pas na de volledige toets. Beide modi bewaren je resultaat.</p></div><div class="panel"><h3>Welke onderdelen komen aan bod?</h3>${[...new Set(QUESTIONS.filter(q=>q.cat===id).map(q=>q.sub))].map(x=>`<span class="tag" style="display:inline-block;margin:4px">${ESC(x)}</span>`).join('')}<div class="note">Je hoeft niet alle vragen in één keer af te werken. Tien minuten oefenen, je fouten verbeteren en de volgende dag herhalen werkt beter dan één lange sessie.< function practice(){return `<section class="hero"><div class="eyebrow">GEPERSONALISEERDE TRAINING</div><h1>Start een oefenronde</h1><p>Kies een onderwerp, de lengte van je oefenreeks en welke vragen je wilt trainen.</p></section><div class="panel"><div class="controls"><label class="control">Onderwerp<select id="pickCat"><option value="all">Alle onderwerpen</option>${CATEGORIES.map(c=>`<option value="${c.id}">${ESC(c.title)}</option>`).join('')}</select></label><label class="control">Aantal vragen<select id="pickCount"><option>10</option><option selected>20</option><option>30</option><option>40</option><option>60</option></select></label><label class="control">Welke vragen?<select id="pickSet"><option value="mix">Gemengd / slim gekozen</option><option value="unseen">Nog nooit geprobeerd</option><option value="due">Toe aan herhaling</option><option value="mistakes">Eerder fout opgelost</option></select></label><label class="control">Oefenmodus<select id="pickMode"><option value="practice">Oefenen met feedback</option><option value="test">Toetsmodus</option></select></label></div><button class="btn primary" id="launch">▶ Start mijn reeks</button></div><div class="panel"><h3>Hoe werkt de herhaling?</h3><p>Een juist antwoord verschuift naar een volgende herhalingsdag. Een fout antwoord komt sneller terug. Zo oefen je vooral de begrippen die nog niet stevig zitten. Je voortgang wordt lokaal opgeslagen en, na een geslaagde online aanmelding, ook doorgestuurd naar Cloudflare.</p></div>`}

ntwoord: <span class="answer-inline">${ESC(q.answer)}</span><div>${ESC(q.explain)}</div></div>`:''}<div class="question-footer"><span class="ref">Bron: officiële vakfiche 2026 · ${ESC(q.ref)}</span><span class="tiny">Tip: typ je formule met gewone cijfers en ^ voor ladingen.</span></div></article>`}
function finishedView(){if(!activeRound)return home();let r=activeRound,percent=Math.round(100*r.right/r.questions.length),minutes=Math.max(1,Math.round((Date.now()-r.startedAt)/60000));return `<section class="hero"><div class="eyebrow">OEFENRONDE AFGEROND</div><h1>${percent>=85?'Prima beheerst!':percent>=60?'Goed bezig, blijf herhalen.':'Herhaal eerst de moeilijke begrippen.'}</h1><p>Je hebt ${r.questions.length} vragen geoefend in ongeveer ${minutes} minuten.</p></section><section class="grid"><div class="kpi"><div class="value">${r.right}</div><div class="lbl">Correct</div></div><div class="kpi"><div class="value">${r.wrong}</div><div class="lbl">Nog moeilijk</div></div><div class="kpi"><div class="value">${percent}%</div><div class="lbl">Score in deze ronde</div></div><div class="kpi"><div class="value">${minutes}</div><div class="lbl">Minuten</div></div></section><div class="panel"><h2>Wat nu?</h2><p>Herhaal de vragen die fout liepen. De belangrijkste begrippen keren later automatisch terug in je herhalingsronde.</p><div class="controls"><button class="btn primary" data-start="${r.cat}|20|practice|mistakes">🔁 Fouten opnieuw oefenen</button><button class="btn ghost" data-start="${r.cat}|20|practice|mix">Nog een reeks</button><button class="btn ghost" data-nav="progress">Mijn vooruitgang</button></div><h3>Jouw antwoorden</h3><div class="table-scroll"><table class="data-table"><thead><tr><th>Vraag</th><th>Onderwerp</th><th>Jouw antwoord</th><th>Beoordeling</th></tr></thead><tbody>${r.attempts.map(a=>{let q=byID[a.id];return `<tr><td>${ESC(q.id)}</td><td>${ESC(q.sub)}</td><td>${ESC(a.answer)}</td><td>${a.yes?'✅ juist':'❌ '+ESC(q.answer)}</td></tr>`}).join('')}</tbody></table></div></div>`}
function review(){let dueQ=QUESTIONS.filter(due),wrongQ=QUESTIONS.filter(q=>state.stats[q.id]?.wrong>0),unseenQ=QUESTIONS.filter(unseen);return `<section class="hero"><div class="eyebrow">GESPREIDE HERHALING</div><h1>Oefen wat nog niet blijft hangen.</h1><p>Hier komen de vragen terug die je eerder fout maakte of die opnieuw herhaald moeten worden. Na een juist antwoord wordt de volgende herhaling later gepland.</p><div class="hero-actions"><button class="btn primary" data-start="all|20|practice|due">↻ Herhaal vragen die aan de beurt zijn</button><button class="btn ghost" data-start="all|20|practice|mistakes">Alle eerdere fouten</button></div></section><div class="grid"><div class="kpi"><div class="value">${dueQ.length}</div><div class="lbl">Nu herhalen</div></div><div class="kpi"><div class="value">${wrongQ.length}</div><div class="lbl">Ooit fout</div></div><div class="kpi"><div class="value">${unseenQ.length}</div><div class="lbl">Nog niet geoefend</div></div><div class="kpi"><div class="value">${QUESTIONS.length-unseenQ.length}</div><div class="lbl">Al geprobeerd</div></div></div><div class="panel"><h2>Moeilijke begrippen</h2>${wrongQ.length?`<div class="table-scroll"><table class="data-table"><thead><tr><th>Onderwerp</th><th>Vraag</th><th>Fouten</th><th>Volgende herhaling</th></tr></thead><tbody>${wrongQ.slice(0,70).map(q=>{let s=state.stats[q.id];return `<tr><td>${ESC(q.sub)}</td><td>${q.prompt}</td><td><span class="pill due">${s.wrong}</span></td><td>${dateFmt(s.dueAt)}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nog geen fouten opgeslagen. Begin een eerste oefenronde om je persoonlijke herhalingslijst op te bouwen.</div>'}</div>`}
function progressView(){const s=score();let spark=[];for(let d=13;d>=0;d--){let day=new Date();day.setDate(day.getDate()-d);let key=day.toISOString().slice(0,10);spark.push(state.history.filter(h=>h.at?.slice(0,10)===key).length)}let max=Math.max(1,...spark);return `<section class="hero"><div class="eyebrow">INZICHT & ONLINE OPVOLGING</div><h1>Mijn chemievoortgang</h1><p>Bekijk wat je beheerst, welke begrippen nog moeilijk zijn en wat binnenkort opnieuw aan bod komt.</p></section><div class="grid"><div class="kpi"><div class="value">${s.tried}</div><div class="lbl">Vragen geprobeerd</div></div><div class="kpi"><div class="value">${s.passed}</div><div class="lbl">Minstens één keer juist</div></div><div class="kpi"><div class="value">${state.history.length}</div><div class="lbl">Antwoordpogingen bewaard</div></div><div class="kpi"><div class="value">${s.due}</div><div class="lbl">Nu te herhalen</div></div></div><section class="duo"><div class="panel"><h3>Inzet laatste 14 dagen</h3><div class="spark" role="img" aria-label="Aantal gemaakte oefenpogingen in de voorbije 14 dagen">${spark.map(n=>`<i title="${n} pogingen" style="height:${Math.max(4,100*n/max)}%"></i>`).join('')}</div><p class="tiny">Elk balkje stelt één dag voor; hogere balkjes betekenen meer oefenpogingen.</p></div><div class="panel"><h3>Online rapportering</h3><p id="cloudExplain">Huidige status: <b>${ESC(lastCloud)}</b>. Na aanmelden en een geslaagde synchronisatie kun je de resultaten in Cloudflare opvragen met leerpadcode <code>${LEERPAD}</code>.</p><div class="controls"><button class="btn pale sm" data-action="sync">Nu synchroniseren</button><button class="btn ghost sm" data-action="json">Exporteer JSON</button><button class="btn ghost sm" data-action="csv">Exporteer CSV</button></div><div class="note">Bij geen netwerk blijven de antwoorden voorlopig alleen op dit toestel. Een geslaagde online status bevestigt dat de rapportering door Cloudflare is aanvaard.</div></div></section><div class="panel"><h2>Overzicht per onderdeel</h2><div class="table-scroll"><table class="data-table"><thead><tr><th>Onderdeel</th><th>Geprobeerd</th><th>Al juist</th><th>Herhalen</th></tr></thead><tbody>${CATEGORIES.map(c=>{let v=score(c.id);return `<tr><td><button class="btn ghost sm" data-nav="cat:${c.id}">${c.icon} ${ESC(c.title)}</button></td><td>${v.tried} / ${v.total}</td><td>${v.passed}</td><td>${v.due}</td></tr>`}).join('')}</tbody></table></div><div class="controls"><button class="btn ghost" data-action="json">↓ Volledig rapport (.json)</button><button class="btn ghost" data-action="csv">↓ Oefenoverzicht (.csv)</button></div></div>`}
function study(){const list=DATA.elements,ions=DATA.ions,alkanes=DATA.alkanes;return `<section class="hero"><div class="eyebrow">VOORKENNIS · OMDRAAIKAARTEN</div><h1>Leerkaarten en overzicht</h1><p>Probeer het antwoord eerst uit het hoofd te zeggen. Tik daarna op een kaart om de oplossing te tonen. Gebruik de zoekfunctie om bepaalde symbolen, ionen of stofnamen snel terug te vinden.</p></section><div class="panel"><div class="controls"><label class="control">Kies een kaartenreeks<select id="studyGroup"><option value="elements">Chemische symbolen</option><option value="ions">Zuurresten en ionen</option><option value="alkanes">De 10 n-alkanen</option><option value="lab">Labomateriaal</option></select></label><label class="control">Zoeken<input id="studySearch" placeholder="Zoek bijvoorbeeld sulfaat, CH4, Na …"></label><button class="btn pale" id="studyQuiz">Oefen deze reeks →</button></div><p class="tiny">Bijlage 1 van de vakfiche is niet beschikbaar tijdens het examen. De instrumentnamen horen bij jouw ondersteunende kennis. <button class="btn pale sm" data-nav="atlas">Open de beeldatlas met 33 afbeeldingen →</button></p><div class="study-grid" id="studyCards"></div></div><div class="duo"><div class="panel"><h3>Het verschil tussen alkyn en alkeen</h3><p>Een <b>alkaan</b> heeft enkelvoudige C–C-bindingen. Een <b>alkeen</b> heeft een dubbele C=C-binding, een <b>alkyn</b> een drievoudige C≡C-binding. De tien <b>n-alkanen</b> moet je expliciet van naam naar formule en omgekeerd kunnen schrijven.</p><div class="note">Let op: formules zoals C₄H₈ kunnen meerdere structuren voorstellen. De brutoformule alleen vertelt niet altijd exact waar een dubbele binding zit.</div></div><div class="panel"><h3>Schrijf ionen inclusief lading</h3><p>Voorbeelden: <b>SO₄²⁻</b> is een <b>sulfaation</b>, <b>PO₄³⁻</b> een <b>fosfaation</b> en <b>NH₄⁺</b> een <b>ammoniumion</b>. De index (onderaan) is iets anders dan de ionlading (bovenaan).</p><div class="note">Een fout in de lading maakt ook je zoutformule fout. Oefen daarom beide richtingen: naam → formule en formule → naam.</div></div></div>`}

function materialImage(kind,showSource=false){
 if(kind.startsWith('ghs-'))return hazardIcon(kind.slice(4));
 const nm=VISUAL_TO_NAME[kind]||kind;
 const svg=CUSTOM_MATERIAL_SVGS[kind]||oldDrawing(kind);
 const filename=LAB_PHOTOS[nm];
 const photoUrl=EMBEDDED_LAB_PHOTOS[nm] || (filename?'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(filename)+'?width=520':'');
 const page=filename?'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(filename.replaceAll(' ','_')):'';
 const link=showSource&&filename?`<a href="${page}" target="_blank" rel="noopener noreferrer" class="src-info">📷 Echte foto · auteur en licentie op Wikimedia Commons</a>`:'';
 return `<div class="lab-picture" aria-label="Foto van laboratoriummateriaal"><div class="lab-vector">${svg}</div>${filename?`<img src="${photoUrl}" loading="lazy" decoding="async" referrerpolicy="no-referrer" alt="Foto van een laboratoriumvoorwerp" onload="this.classList.add('ready')" onerror="this.remove()">`:''}</div>${link}`;
}
