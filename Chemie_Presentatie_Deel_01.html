<script>

const DATA=JSON.parse(document.getElementById('deck-data').textContent), slides=DATA.slides;

 else if(s.kind==='roadmap'){const chapters=DATA.chapters.length?DATA.chapters:[{code:'Toets 1',title:'Fundamenten en stofklassen',priority:'20 vragen · 50 punten'},{code:'Toets 2',title:'Integratie en toepassingen',priority:'20 vragen · 55 punten'}];h=eye('Deel '+DATA.n+' · studiekaart')+H('h1','Wat gaan we leren?','heading')+'<p class="subhead">Start met de theorie. Bespreek de denkstappen. Laat Olivia eerst zelfstandig antwoorden voordat je de feedback toont.</p><div class="roadmap">'+chapters.map(c=>`<div class="road"><strong>${esc(c.code)} · ${esc(c.title)}</strong><span>${esc(c.priority)}</span></div>`).join('')+'</div>'+linkFoot(s)}

 else if(s.kind==='quiz'){h=eye(s.code+' · meerkeuze met onmiddellijke feedback')+H('h1','Jij beslist','heading')+`<div class="quizquestion">${esc(s.question)}</div><div class="options">${s.options.map((v,i)=>`<button class="optbtn" data-opt="${i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(v)}</span></button>`).join('')}</div><div class="feedback" id="feedback" role="status"></div>`+linkFoot(s)}
 else if(s.kind==='truefalse'){h=eye(s.code+' · juist of fout?')+H('h1','Foutendetective','heading')+`<div class="quizquestion" style="max-width:900px">${esc(s.claim)}</div><p class="subhead">Denk na. Is deze uitspraak volledig juist, of zit er een denkfout in?</p><div class="tfrow"><button class="tfbtn" data-tf="1">✓ Juist</button><button class="tfbtn" data-tf="0">× Fout</button></div><div class="feedback" id="feedback" role="status"></div>`+linkFoot(s)}
 else if(s.kind==='challenge'){h=eye(s.code+' · mondelinge of schriftelijke oefening')+H('h1','Jouw redenering telt','heading')+`<div class="example">${esc(s.question)}</div><p class="subhead">Werk zelfstandig. Noem je tussenstappen en verklaar waarom je deze aanpak kiest.</p><button class="reveal" id="reveal">Toon mogelijke uitwerking</button><div class="answer" id="answer"><b>Modelantwoord</b><p>${esc(s.answer)}</p></div>`+linkFoot(s)}
 else if(s.kind==='applet'){h=eye('Interactieve applet · deel '+DATA.n)+H('h1',s.title,'heading')+`<p class="subhead">${esc(s.desc)}</p><div class="appletbox" id="appletbox"></div><p class="pdfhint">💡 Verander telkens één waarde en leg uit welk gevolg je ziet. Dit is een didactisch model, geen laboratoriummeting.</p>`}
 else if(s.kind==='recap'){h=eye('Terugblik · deel '+DATA.n)+H('h1','Dit wil je zelfstandig kunnen','heading')+'<div class="recap">'+DATA.chapters.map(c=>`<div class="recapitem"><span class="checkdot">✓</span><div><b>${esc(c.code)} · ${esc(c.title)}</b><br>${esc(c.concepts[0])}</div></div>`).join('')+'</div>'+linkFoot(s)}
 else if(s.kind==='examintro'){h=eye('Proefexamen '+s.which+' · zelfstandige verwerking')+H('h1',s.name,'heading')+`<div class="pill">${s.total} punten · 20 opdrachten</div><p class="subhead" style="margin-top:30px">Maak de opgaven eerst zonder oplossing. Je kunt een eigen antwoord noteren; dit wordt alleen lokaal in deze browser bewaard. Toon daarna de modeloplossing en beoordeel zelf of je redenering volledig is.</p><div class="coverbox"><div class="meta">Notatie, atoom- en ladingsbalansen en eenheden tellen mee.</div><div class="bigindex">${s.which}</div></div>`}
 else if(s.kind==='examquestion'){h=eye(`Proefexamen ${s.which} · vraag ${s.num}/20 · ${s.points} punten`)+H('h1',s.topic+' · oefenvraag','heading')+`<div class="quizquestion">${esc(s.question)}</div><label class="tiny" for="ownAnswer">Mijn antwoord / denkstappen</label><textarea id="ownAnswer" placeholder="Noteer hier eerst jouw redenering..." aria-label="Eigen antwoord"></textarea><div class="markrow" style="margin-top:12px"><button class="reveal" id="reveal">Toon modeloplossing</button><button class="markbtn" data-mark="ok">✓ Goed begrepen</button><button class="markbtn" data-mark="retry">↺ Opnieuw oefenen</button></div><div class="answer" id="answer"><b>Uitwerking / modelantwoord</b><p>${esc(s.answer)}</p></div><div class="pdfhint">Bron: oorspronkelijke proefexamens uit deel 07. Oefen eerst zelfstandig; oplossingen zijn bewust verborgen.</div>`}
 else if(s.kind==='final'){h=eye('ASTREM Lab · einde van dit deel')+H('h1','Je bent klaar voor de volgende stap!','heading')+`<p class="subhead">De presentatie is een begeleide verwerking van de cursusbundel, geen vervanging van de volledige theorie en oefeningen. Herhaal de onderwerpen waarbij je nog twijfelt.</p><div class="recap"><div class="recapitem"><span class="checkdot">1</span>Bestudeer de theorie in de PDF en maak de basisvragen.</div><div class="recapitem"><span class="checkdot">2</span>Los moeilijke vragen opnieuw op zonder hints.</div><div class="recapitem"><span class="checkdot">3</span>Noteer wat nog niet duidelijk is voor de volgende bijles.</div></div>`+linkFoot(s)}
 box.innerHTML=h;el('bar').style.width=((ix+1)/n*100)+'%';el('slidecount').textContent=`${ix+1} / ${n} dia’s`;el('prev').disabled=ix===0;el('next').disabled=ix===n-1;
 el('slidesNav').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===ix));const active=el('slidesNav').querySelector('button.active');if(active)active.scrollIntoView({block:'nearest'});
 if(s.kind==='quiz')box.querySelectorAll('[data-opt]').forEach(b=>b.addEventListener('click',()=>{const chosen=Number(b.dataset.opt),ok=chosen===s.answer;box.querySelectorAll('[data-opt]').forEach((t,j)=>{t.classList.toggle('correct',j===s.answer);t.classList.toggle('wrong',j===chosen&&!ok);t.disabled=true});const f=el('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'✓ Juist!':'× Niet helemaal. Het juiste antwoord is '+esc('ABCD'[s.answer])+'.'}</strong>${esc(s.explain)}`}));
 if(s.kind==='truefalse')box.querySelectorAll('[data-tf]').forEach(b=>b.addEventListener('click',()=>{const chosen=b.dataset.tf==='1',ok=chosen===s.is_true;box.querySelectorAll('[data-tf]').forEach(x=>x.disabled=true);const f=el('feedback');f.className='feedback show '+(ok?'good':'bad');f.innerHTML=`<strong>${ok?'✓ Correct ingeschat!':'× Bekijk de redenering opnieuw.'}</strong>${esc(s.correction)}`}));
 if(s.kind==='challenge'||s.kind==='examquestion'){const btn=el('reveal');btn.addEventListener('click',()=>{el('answer').classList.toggle('show');btn.textContent=el('answer').classList.contains('show')?'Verberg modeloplossing':'Toon modeloplossing'});}
 if(s.kind==='examquestion'){const k=`astremlab-exam-${s.which}-${s.num}`,m=k+'-mark';const ta=el('ownAnswer');try{ta.value=localStorage.getItem(k)||''}catch{}ta.addEventListener('input',()=>{try{localStorage.setItem(k,ta.value)}catch{}});const buttons=box.querySelectorAll('[data-mark]');buttons.forEach(b=>{try{b.classList.toggle('selected',localStorage.getItem(m)===b.dataset.mark)}catch{}b.onclick=()=>{try{localStorage.setItem(m,b.dataset.mark)}catch{}buttons.forEach(x=>x.classList.toggle('selected',x===b))}})}

el('prev').onclick=()=>go(ix-1);el('next').onclick=()=>go(ix+1);el('resetView').onclick=()=>go(0);el('menuToggle').onclick=()=>{sideOpen=!sideOpen;el('side').classList.toggle('open',sideOpen)};
el('fullscreen').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
